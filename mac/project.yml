# The Mac app's Xcode project, generated by XcodeGen: `xcodegen` in this folder writes Housekeep.xcodeproj.
# mac/build.sh does that, builds, and adds the Node runtime and Housekeep itself to the app.
name: Housekeep
options:
  bundleIdPrefix: dev.housekeep
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: S6KA37TYUM
targets:
  Housekeep:
    type: application
    platform: macOS
    sources:
      - path: Housekeep
    info:
      path: Housekeep/Info.plist
      properties:
        CFBundleDisplayName: Housekeep
        CFBundleName: Housekeep
        LSApplicationCategoryType: public.app-category.developer-tools
        # A menu bar app: no Dock icon until the map window opens.
        LSUIElement: true
        NSHumanReadableCopyright: MIT License
        # macOS asks before Housekeep looks for repos in these folders; this is the reason it gives.
        NSDocumentsFolderUsageDescription: Housekeep looks for your git repos here, to check they're committed and pushed. It only reads them.
        NSDesktopFolderUsageDescription: Housekeep looks for your git repos here, to check they're committed and pushed. It only reads them.
        NSDownloadsFolderUsageDescription: Housekeep looks for your git repos here, to check they're committed and pushed. It only reads them.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.housekeep.app
        PRODUCT_NAME: Housekeep
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Manual
        # Signed properly by build.sh once the runtime is inside; Xcode's own signature is ad hoc.
        CODE_SIGN_IDENTITY: "-"
        COMBINE_HIDPI_IMAGES: YES

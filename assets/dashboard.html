<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Housekeep</title>
<link rel="icon" id="favicon" href="data:,">
<style>
/*__FONTS__*/
/* Pitch black, layered in small steps. Colour is reserved for state, and even
   then only as a dot or a line: text stays grey or white. */
:root {
  --black: #000;
  --shell: #080808;
  --layer-1: #0e0e0e;
  --layer-2: #151515;
  --layer-3: #1b1b1b;
  --line: rgba(255, 255, 255, 0.07);
  --line-2: rgba(255, 255, 255, 0.11);
  --text: #ededed;
  --text-2: #9b9b9b;
  --text-3: #5f5f5f;
  --accent: #8a8fd9;
  --green: #52a67c;
  --amber: #c89b4e;
  --red: #cf6360;
  --track: #d9d9d9;
  --track-soft: #3b3b3b;
  --font: "Housekeep Sans", "Housekeep Fill", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace;
  --ease: cubic-bezier(0.23, 1, 0.32, 1);
  --column: 1080px;
  --edge: 24px;
  --gutter: max(var(--edge), calc((100% - var(--column)) / 2));
  --inset: 24px;
}
* { box-sizing: border-box; }
html { -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; background: var(--black); }
body { margin: 0; min-height: 100vh; background: var(--black); color: var(--text); font: 400 14px/1.5 var(--font); font-feature-settings: "tnum" 1; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 1.5px solid var(--text-2); outline-offset: 2px; }
.mono { font-family: var(--mono); font-size: 12px; letter-spacing: -0.01em; }
[hidden] { display: none !important; }
/* Scrollbars: a hairline thumb that shows while something scrolls, then hides again.
   Chrome and Safari take the ::-webkit-scrollbar rules; Firefox takes the standard ones. */
*::-webkit-scrollbar { width: 6px; height: 6px; background: transparent; }
*::-webkit-scrollbar-track, *::-webkit-scrollbar-corner { background: transparent; }
*::-webkit-scrollbar-thumb { border: 1px solid transparent; border-radius: 3px; background: transparent padding-box; }
.scrolling::-webkit-scrollbar-thumb, *::-webkit-scrollbar-thumb:hover { background-color: rgba(255, 255, 255, 0.18); }
@supports not selector(::-webkit-scrollbar) {
  * { scrollbar-width: thin; scrollbar-color: transparent transparent; }
  .scrolling { scrollbar-color: rgba(255, 255, 255, 0.18) transparent; }
}


[data-tier="at-risk"] { --c: var(--red); }
[data-tier="attention"] { --c: var(--amber); }
[data-tier="safe"] { --c: var(--green); }
[data-tier="unknown"] { --c: var(--text-3); }
.dot { display: inline-block; flex: none; width: 6px; height: 6px; border-radius: 50%; background: var(--c); }
.status { display: inline-flex; align-items: center; gap: 8px; color: var(--text); font-size: 13px; white-space: nowrap; }
.status[data-tier="safe"] { color: var(--text-3); }
.tag { display: inline-flex; align-items: center; height: 20px; padding: 0 8px; border-radius: 999px; background: var(--layer-2); color: var(--text-3); font-size: 11px; white-space: nowrap; }
.tag.here { color: var(--accent); }
.tag.warn { color: var(--amber); }

/* ---------- layout ---------- */
.app { display: grid; grid-template-columns: 248px minmax(0, 1fr); height: 100vh; overflow: hidden; }
.side { height: 100vh; overflow-y: auto; display: flex; flex-direction: column; padding: 20px 12px 16px; }
.brand { display: flex; align-items: center; gap: 10px; padding: 6px 10px 26px; font-size: 15px; font-weight: 500; letter-spacing: -0.01em; }
/* The mark: main arriving at the map's interchange, lit with the worst project's light. */
.brand .logo { flex: none; width: 22px; height: 22px; margin: -2px 0; }
.brand .logo circle { transition: fill 500ms var(--ease); }
.nav { display: grid; grid-template-columns: minmax(0, 1fr); gap: 1px; }
.nav + .nav { margin-top: 18px; }
.nav a { display: flex; align-items: center; gap: 11px; min-height: 36px; padding: 0 12px; border-radius: 10px; color: var(--text-2); font-size: 13.5px; transition: background-color 120ms var(--ease), color 120ms var(--ease); }
.nav a:hover { color: var(--text); background: var(--layer-1); }
.nav a[aria-current="page"] { color: var(--text); background: var(--layer-2); }
.nav a .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav a .n { color: var(--text-3); font-size: 12px; }
.nav svg { width: 16px; height: 16px; flex: none; color: var(--text-3); }

/* The shell: inset from the top, right and bottom, scrolling on its own so its edges never move. */
.main { min-width: 0; margin: 8px 8px 8px 0; height: calc(100vh - 16px); overflow-y: auto; border-radius: 22px; background: var(--shell); border: 1px solid var(--line); overscroll-behavior: contain; }
.bar { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: calc(var(--edge) * 0.75) var(--gutter); background: var(--shell); box-shadow: 0 1px 0 transparent; transition: box-shadow 160ms var(--ease); }
.bar.scrolled { box-shadow: 0 1px 0 var(--line); }
.crumbs { display: flex; align-items: center; gap: 9px; min-width: 0; color: var(--text-3); font-size: 13.5px; }
.crumbs a:hover { color: var(--text-2); }
.crumbs .here { color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar-right { display: flex; align-items: center; gap: 16px; color: var(--text-3); font-size: 12.5px; white-space: nowrap; }
.live { display: inline-flex; align-items: center; gap: 8px; padding: 0; border: 0; background: none; color: var(--text-3); font-size: 12.5px; }
.live .dot { background: var(--text-3); }
.live[data-state="live"] .dot, .live[data-state="demo"] .dot { background: var(--green); }
.live[data-state="reconnecting"] .dot, .live[data-state="restart"] .dot { background: var(--amber); }
.live[data-state="restart"] { color: var(--text-2); cursor: pointer; }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 36px; padding: 0 18px;
  border: 0; border-radius: 999px; background: var(--layer-2); box-shadow: inset 0 0 0 1px var(--line);
  color: var(--text); font-size: 13px; white-space: nowrap; cursor: pointer; text-decoration: none;
  transition: background-color 120ms var(--ease), transform 120ms var(--ease), opacity 120ms var(--ease);
}
.btn:hover { background: var(--layer-3); }
.btn:active { transform: scale(0.97); }
.btn svg { width: 15px; height: 15px; flex: none; color: var(--text-2); stroke-width: 1.7; }
/* Some fonts' letters sit a little low in their box; fonts/local/faces.json can set
   labelLift so button words centre on the cap height. Geist needs none. */
.btn > span { position: relative; top: var(--label-lift, 0px); }
.btn.primary > span { top: 0; }
/* Optical balance: icons carry built-in whitespace (about 2px beside the upload and copy
   glyphs, 3.5px beside the chevron), so the icon side gets less padding to look even. */
.btn:has(> svg.idle:first-child) { padding-left: 16px; }
.btn:has(> svg.trail) { padding-right: 15px; gap: 6px; }
.btn svg.trail { width: 13px; height: 13px; stroke-width: 1.8; }
.btn.ghost { background: transparent; box-shadow: none; color: var(--text-2); }
.btn.ghost:hover { background: var(--layer-2); color: var(--text); }
.btn.icon, .btn.icon:has(> svg.idle:first-child) { width: 36px; padding: 0; }
.btn.primary { background: var(--text); color: var(--black); box-shadow: none; font-weight: 500; }
.btn.primary svg { color: var(--black); }
.btn.primary:hover { opacity: 0.88; background: var(--text); }
.btn.danger:hover { color: var(--red); }
.btn.danger:hover svg { color: var(--red); }
.btn .spin, .btn .done { display: none; }
.btn.busy { pointer-events: none; opacity: 0.6; }
.btn.busy .spin { display: block; animation: spin 900ms linear infinite; }
.btn.busy .idle, .btn.copied .idle { display: none; }
.btn.copied .done { display: block; }
@keyframes spin { to { transform: rotate(360deg); } }

.menu { position: relative; }
.menu summary { list-style: none; }
.menu summary::-webkit-details-marker { display: none; }
.menu-list { position: absolute; right: 0; top: calc(100% + 6px); z-index: 6; min-width: 176px; padding: 5px; border-radius: 16px; background: var(--layer-3); box-shadow: inset 0 0 0 1px var(--line-2), 0 16px 40px rgba(0, 0, 0, 0.7); display: grid; }
.menu-list .btn { justify-content: flex-start; width: 100%; background: transparent; box-shadow: none; color: var(--text-2); }
.menu-list .btn:hover { background: var(--layer-2); color: var(--text); }
.menu-list .btn { border-radius: 11px; height: 34px; padding: 0 12px; }

/* ---------- content ---------- */
/* The bar pads evenly so it balances once it sticks; the view makes up the rest of the gap. */
.view { padding: calc(var(--edge) / 4) var(--gutter) var(--edge); display: grid; gap: 16px; align-content: start; }
.view.enter { animation: enter 220ms var(--ease) both; }
@keyframes enter { from { opacity: 0; transform: translateY(4px); } }
.head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px 24px; flex-wrap: wrap; margin-bottom: 16px; }
.head h1 { margin: 0; font-size: 34px; line-height: 1.1; font-weight: 500; letter-spacing: -0.03em; overflow-wrap: anywhere; }
.head .meta { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 12px; margin-top: 10px; color: var(--text-3); font-size: 13px; }
.head .meta .sep { width: 3px; height: 3px; border-radius: 50%; background: var(--text-3); }
.head .end { display: flex; align-items: center; gap: 8px; }
.head .end .status { margin-right: 8px; }

.panel { background: transparent; border-radius: 18px; box-shadow: inset 0 0 0 1px var(--line); min-width: 0; }
.panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 56px; padding: 0 var(--inset); }
.panel-head h2 { margin: 0; font-size: 14px; font-weight: 500; }
.panel-head .end { display: flex; align-items: center; gap: 10px; color: var(--text-3); font-size: 12.5px; }
.panel-body { padding: 4px var(--inset) var(--inset); }

.strip { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); }
.cell { padding: 22px var(--inset) var(--inset); min-width: 0; }
.cell + .cell { box-shadow: inset 1px 0 0 var(--line); }
.cell .label { display: flex; align-items: center; gap: 8px; color: var(--text-2); font-size: 13px; }
.cell .value { display: block; margin-top: 18px; font-size: 38px; line-height: 1; font-weight: 400; letter-spacing: -0.035em; }
.cell[data-tier="safe"] .value { color: var(--text-3); }
.cell .caption { margin: 10px 0 0; color: var(--text-3); font-size: 12.5px; line-height: 1.45; overflow-wrap: anywhere; }

.next { display: flex; align-items: center; justify-content: space-between; gap: 18px 32px; flex-wrap: wrap; padding: 22px var(--inset); }
.next .kicker { display: flex; align-items: center; gap: 8px; color: var(--text-3); font-size: 12.5px; }
.next h2 { margin: 8px 0 0; font-size: 21px; line-height: 1.25; font-weight: 500; letter-spacing: -0.02em; }
.next p { margin: 4px 0 0; max-width: 560px; color: var(--text-2); font-size: 13.5px; line-height: 1.5; }
.next .act { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

table { width: 100%; border-collapse: collapse; }
.scroll { overflow-x: auto; }
.scroll table { min-width: 720px; }
th { padding: 0 16px 10px; color: var(--text-3); font-size: 12px; font-weight: 400; text-align: left; white-space: nowrap; }
td { padding: 13px 16px; border-top: 1px solid var(--line); vertical-align: middle; white-space: nowrap; }
th.end, td.end { text-align: right; }
tr.link { cursor: pointer; }
tr.link:hover td { background: rgba(255, 255, 255, 0.018); }
.proj { display: flex; align-items: center; gap: 12px; }
.proj b { font-size: 14px; font-weight: 500; }
.proj small { display: block; color: var(--text-3); font: 11.5px/1.4 var(--mono); }
.bname { display: flex; align-items: center; gap: 8px; max-width: 260px; }
th:first-child, td:first-child { padding-left: var(--inset); }
th:last-child, td:last-child { padding-right: var(--inset); }
.bname .n { overflow: hidden; text-overflow: ellipsis; }
.bname .n i { font-style: normal; color: var(--text-3); }
.muted { color: var(--text-3); font-size: 12.5px; }
.row-actions { display: inline-flex; align-items: center; justify-content: flex-end; gap: 6px; }
.row-actions .btn { height: 34px; }
.row-actions .btn.icon { width: 34px; }
.chev { width: 14px; height: 14px; color: var(--text-3); }
.more { display: flex; justify-content: center; padding: 10px 0 14px; border-top: 1px solid var(--line); }

.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; margin: 14px 0 0; padding: 0; list-style: none; color: var(--text-3); font-size: 12px; }
.legend li { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.legend svg { flex: none; overflow: visible; }
.map svg { display: block; overflow: visible; }

.folder { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; align-items: center; gap: 16px; min-height: 54px; padding: 0 var(--inset); border-top: 1px solid var(--line); }
.folder b { display: block; font-size: 13.5px; font-weight: 400; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.folder small { display: block; color: var(--text-3); font: 11.5px/1.4 var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.empty { display: grid; place-items: center; min-height: 60vh; text-align: center; }
.empty h1 { margin: 0; font-size: 28px; font-weight: 500; letter-spacing: -0.02em; }
.empty p { margin: 10px auto 0; max-width: 420px; color: var(--text-2); }

dialog.confirm { border: 0; padding: 0; width: min(500px, calc(100vw - 32px)); background: var(--layer-2); color: var(--text); border-radius: 22px; box-shadow: inset 0 0 0 1px var(--line-2), 0 32px 80px rgba(0, 0, 0, 0.8); }
dialog.confirm[open] { animation: pop 180ms var(--ease) both; }
dialog.confirm::backdrop { background: rgba(0, 0, 0, 0.72); }
@keyframes pop { from { opacity: 0; transform: scale(0.97); } }
.confirm-body { display: grid; gap: 12px; padding: 22px 22px 18px; }
.confirm-body h3 { margin: 0; font-size: 18px; line-height: 1.3; font-weight: 500; letter-spacing: -0.015em; }
.confirm-body p { margin: 0; color: var(--text-2); font-size: 13.5px; line-height: 1.55; }
.confirm-body ul { margin: 4px 0 0; padding: 4px 0; list-style: none; max-height: 180px; overflow-y: auto; border-radius: 14px; background: var(--layer-1); box-shadow: inset 0 0 0 1px var(--line); }
.confirm-body li { display: flex; justify-content: space-between; gap: 16px; padding: 7px 12px; font-size: 13px; }
.confirm-body li span:last-child { color: var(--text-3); }
.confirm-body pre { margin: 0; padding: 10px 14px; border-radius: 14px; background: var(--black); box-shadow: inset 0 0 0 1px var(--line); color: var(--text-2); font: 11.5px/1.6 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; max-height: 120px; overflow-y: auto; }
.confirm-actions { display: flex; justify-content: flex-end; gap: 8px; padding: 0 22px 20px; }

.toasts { position: fixed; right: 20px; bottom: 20px; z-index: 20; display: grid; gap: 8px; width: min(380px, calc(100vw - 32px)); }
.toast { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 2px 12px; align-items: start; padding: 13px 10px 13px 15px; border-radius: 18px; background: var(--layer-3); box-shadow: inset 0 0 0 1px var(--line-2), 0 16px 40px rgba(0, 0, 0, 0.7); animation: toast-in 220ms var(--ease) both; }
.toast .dot { margin-top: 7px; }
.toast b { display: block; font-size: 13.5px; font-weight: 400; overflow-wrap: anywhere; }
.toast pre { margin: 4px 0 0; color: var(--text-3); font: 11px/1.5 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; max-height: 66px; overflow: hidden; }
.toast .btn { width: 24px; height: 24px; }
.toast.leaving { animation: toast-out 160ms var(--ease) both; }
@keyframes toast-in { from { opacity: 0; transform: translateY(6px); } }
@keyframes toast-out { to { opacity: 0; } }

@media (max-width: 1100px) {
  .strip { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .cell:nth-child(3) { box-shadow: inset 0 1px 0 var(--line); }
  .cell:nth-child(4) { box-shadow: inset 1px 0 0 var(--line), inset 0 1px 0 var(--line); }
}
@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); height: auto; overflow: visible; }
  .side { height: auto; overflow: visible; padding: 14px 16px 10px; }
  .main { margin: 0 6px 6px; height: auto; overflow: visible; }
  .bar { border-radius: 22px 22px 0 0; }
  .brand { padding: 2px 0 12px; }
  .nav { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
  .nav::-webkit-scrollbar { display: none; }
  .nav + .nav { margin-top: 4px; }
  .nav a { flex: none; min-height: 32px; }
  .nav a .name { overflow: visible; }
  .bar .when { display: none; }
  :root { --edge: 16px; --gutter: 16px; --inset: 16px; }
  .head h1 { font-size: 28px; }
  .cell .value { font-size: 32px; margin-top: 12px; }
  .cell { padding-top: 16px; padding-bottom: 16px; }
  .next { padding-top: 18px; padding-bottom: 18px; }
}
@media (prefers-reduced-motion: reduce) {
  .view.enter, dialog.confirm[open], .toast, .toast.leaving { animation: none; }
  .btn.busy .spin { animation-duration: 2400ms; }
}

/* Shape as well as colour, so the lights still read for colour-blind eyes:
   red is a filled dot, amber a ring, green a small quiet dot. */
.dot[data-tier="attention"] { background: transparent; box-shadow: inset 0 0 0 1.5px var(--c); }
.dot[data-tier="safe"] { width: 5px; height: 5px; opacity: 0.85; }

/* "What's this?" definitions */
.q { display: inline-grid; place-items: center; flex: none; width: 16px; height: 16px; padding: 0; border: 0; border-radius: 50%; background: var(--layer-2); color: var(--text-3); font: 500 10.5px/1 var(--font); cursor: help; transition: color 120ms var(--ease), background-color 120ms var(--ease); }
.q:hover, .q:focus-visible { color: var(--text); background: var(--layer-3); }
.gloss[popover] { position: fixed; inset: auto; margin: 0; width: 290px; padding: 14px 16px; border: 0; border-radius: 16px; background: var(--layer-3); color: var(--text-2); box-shadow: inset 0 0 0 1px var(--line-2), 0 16px 40px rgba(0, 0, 0, 0.75); font-size: 13px; line-height: 1.55; }
.gloss b { display: block; margin-bottom: 4px; color: var(--text); font-weight: 500; }
.term { display: inline-flex; align-items: center; gap: 7px; }

/* ---------- onboarding: a modal with the drawing in one panel and the words in the next ---------- */
dialog.ob { width: min(560px, calc(100vw - 32px)); max-width: none; max-height: calc(100vh - 32px); margin: auto; padding: 8px; border: 0; border-radius: 28px; background: var(--layer-1); color: var(--text); overflow: hidden; box-shadow: inset 0 0 0 1px var(--line-2), 0 40px 120px rgba(0, 0, 0, 0.85); }
dialog.ob::backdrop { background: rgba(0, 0, 0, 0.74); backdrop-filter: blur(8px); }
dialog.ob:focus { outline: none; }
dialog.ob[open] { display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 8px; animation: ob-open 420ms var(--ease) both; }
@keyframes ob-open { from { opacity: 0; transform: translateY(10px) scale(0.985); } }
.ob-stage { position: relative; height: 248px; border-radius: 20px; background: var(--shell); box-shadow: inset 0 0 0 1px var(--line); overflow: hidden; }
.ob-skip { position: absolute; top: 12px; right: 12px; z-index: 1; }
.ob-art { display: grid; place-items: center; width: 100%; height: 100%; padding: 42px 20px 14px; }
/* Each step's drawing, sized to the compact stage. */
.ob-art .orb { width: 184px; height: 184px; }
.ob-text { display: grid; align-content: start; padding: 22px 22px 18px; border-radius: 20px; box-shadow: inset 0 0 0 1px var(--line); overflow-y: auto; }
.ob-copy { min-height: 84px; }
.ob-copy h1 { margin: 0; font-size: 21px; line-height: 1.2; font-weight: 500; letter-spacing: -0.025em; text-wrap: balance; }
.ob-copy p { margin: 6px 0 0; max-width: 460px; color: var(--text-2); font-size: 14px; line-height: 1.55; text-wrap: pretty; }
.ob-foot { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-top: 20px; }
.ob-progress { display: flex; gap: 6px; }
.ob-progress i { position: relative; width: 28px; height: 3px; border-radius: 3px; background: var(--layer-3); overflow: hidden; }
.ob-progress i::after { content: ""; position: absolute; inset: 0; border-radius: inherit; background: var(--text-2); transform: scaleX(0); transform-origin: left; transition: transform 520ms var(--ease); }
.ob-progress i.done::after { transform: scaleX(1); }
.ob-actions { display: flex; align-items: center; gap: 8px; min-height: 36px; }
.ob-actions .btn { height: 36px; padding: 0 18px; font-size: 13px; }
.ob-actions .btn.primary:has(> svg.idle:first-child) { padding-left: 16px; }
/* The way on: two rings ripple out from "Show me around", half a beat apart, like the light's rings in the first step. */
.btn.beckon { position: relative; }
.btn.beckon::before, .btn.beckon::after { content: ""; position: absolute; inset: 0; border-radius: inherit; border: 1.5px solid rgba(237, 237, 237, 0.6); opacity: 0; pointer-events: none; animation: ripple 2.4s cubic-bezier(0.22, 1, 0.36, 1) infinite; }
.btn.beckon::after { animation-delay: 1.2s; }
@keyframes ripple { 0% { inset: 0; opacity: 0.7; } 100% { inset: -12px; opacity: 0; } }

/* staggered entrance: every step's pieces arrive in reading order */
.ob-in > * { animation: ob-rise 560ms var(--ease) both; }
.ob-in > *:nth-child(2) { animation-delay: 70ms; }
.ob-in > *:nth-child(3) { animation-delay: 140ms; }
.ob-in > *:nth-child(4) { animation-delay: 210ms; }
.ob-out > * { animation: ob-leave 200ms var(--ease) both; }
@keyframes ob-rise { from { opacity: 0; transform: translateY(10px); } }
@keyframes ob-leave { to { opacity: 0; transform: translateY(-6px); } }
.ob-swap { animation: ob-swap 420ms var(--ease) both; }
@keyframes ob-swap { from { opacity: 0; filter: blur(4px); } }

/* 1 · the light */
.orb { overflow: visible; }
.orb .glow { transform-box: fill-box; transform-origin: center; animation: orb-breathe 4.8s ease-in-out infinite; }
.orb .pulse { transform-box: fill-box; transform-origin: center; animation: orb-pulse 3.6s cubic-bezier(0.22, 1, 0.36, 1) infinite; }
.orb .pulse.two { animation-delay: 1.2s; }
.orb .pulse.three { animation-delay: 2.4s; }
.orb .orbit { transform-origin: 0 0; animation: orb-spin 36s linear infinite; }
.orb .orbit.slow { animation-duration: 60s; animation-direction: reverse; }
@keyframes orb-breathe { 50% { transform: scale(0.92); opacity: 0.8; } }
@keyframes orb-pulse { 0% { transform: scale(1); opacity: 0.55; } 100% { transform: scale(3.4); opacity: 0; } }
@keyframes orb-spin { to { transform: rotate(360deg); } }

/* 2 · the check */
.scan { width: min(440px, 100%); display: grid; text-align: left; }
.scan-row { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; align-items: center; gap: 14px; height: 32px; border-top: 1px solid var(--line); opacity: 0; transform: translateY(6px); transition: opacity 360ms var(--ease), transform 360ms var(--ease); }
.scan-row:first-child { border-top: 0; }
.scan-row.shown { opacity: 1; transform: none; }
.scan-row b { font-size: 14px; font-weight: 400; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.scan-row .v { color: var(--text-3); font-size: 13px; white-space: nowrap; opacity: 0; transition: opacity 320ms var(--ease); }
.scan-row.done .v { opacity: 1; color: var(--text-2); }
.scan-row .ind { position: relative; display: grid; place-items: center; width: 18px; height: 18px; }
.scan-row .spinner { width: 14px; height: 14px; animation: spin 800ms linear infinite; color: var(--text-3); }
.scan-row.done .spinner { display: none; }
.scan-row .dot { transform: scale(0); transition: transform 420ms cubic-bezier(0.34, 1.56, 0.64, 1); }
.scan-row.done .dot { transform: scale(1); }
.scan-more { height: 32px; display: flex; align-items: center; padding-left: 32px; border-top: 1px solid var(--line); color: var(--text-3); font-size: 13px; opacity: 0; transition: opacity 360ms var(--ease); }
.scan-more.shown { opacity: 1; }

/* 3 · the menu bar */
.mb { position: relative; width: min(460px, 100%); height: 192px; }
.mb-bar { display: flex; align-items: center; gap: 18px; height: 30px; padding: 0 14px; border-radius: 9px; background: #1b1b1d; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.06); color: var(--text-2); font-size: 12.5px; text-align: left; }
.mb-bar b { color: var(--text); font-weight: 500; }
.mb-right { display: flex; align-items: center; gap: 14px; margin-left: auto; color: var(--text-2); }
.mb-right svg { width: 15px; height: 15px; }
.mb-gl { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px; border-radius: 6px; background: rgba(255, 255, 255, 0.08); color: var(--text); }
.mb-gl i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); box-shadow: 0 0 10px color-mix(in srgb, var(--c) 60%, transparent); transition: background-color 500ms var(--ease), box-shadow 500ms var(--ease); }
.mb-menu { position: absolute; top: 36px; right: 70px; width: 236px; padding: 6px; border-radius: 12px; background: #1f1f22; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08), 0 18px 40px rgba(0, 0, 0, 0.6); text-align: left; transform-origin: top right; animation: mb-open 520ms var(--ease) 320ms both; }
@keyframes mb-open { from { opacity: 0; transform: scale(0.96) translateY(-4px); } }
.mb-menu .h { padding: 6px 10px 8px; color: var(--text); font-size: 12.5px; font-weight: 500; border-bottom: 1px solid rgba(255, 255, 255, 0.06); margin-bottom: 4px; }
.mb-menu .r { display: flex; align-items: center; gap: 10px; height: 28px; padding: 0 10px; border-radius: 6px; color: var(--text-2); font-size: 12.5px; }
.mb-menu .r:first-of-type { background: rgba(255, 255, 255, 0.05); color: var(--text); }
.mb-caption { position: absolute; left: 0; right: 0; bottom: 0; display: flex; justify-content: center; }
.mb-caption > span { display: inline-flex; align-items: center; gap: 9px; height: 32px; padding: 0 14px; border-radius: 999px; background: var(--layer-1); box-shadow: inset 0 0 0 1px var(--line); color: var(--text-2); font-size: 13px; }


.tour-shield { position: fixed; inset: 0; z-index: 38; }
.tour-spot { position: fixed; z-index: 39; border-radius: 16px; pointer-events: none; box-shadow: 0 0 0 1.5px rgba(255, 255, 255, 0.28), 0 0 0 200vmax rgba(0, 0, 0, 0.74); transition: top 300ms var(--ease), left 300ms var(--ease), width 300ms var(--ease), height 300ms var(--ease); }
/* The spotlit part ripples the same way, its corners growing with the ring so the shape holds. */
.tour-spot::before, .tour-spot::after { content: ""; position: absolute; inset: 0; border-radius: inherit; border: 2px solid rgba(255, 255, 255, 0.7); opacity: 0; animation: spot-ripple 2.4s cubic-bezier(0.22, 1, 0.36, 1) infinite; }
.tour-spot::after { animation-delay: 1.2s; }
@keyframes spot-ripple { 0% { inset: 0; border-radius: 16px; opacity: 0.9; } 100% { inset: -14px; border-radius: 30px; opacity: 0; } }
.tour-card { position: fixed; z-index: 40; width: 316px; padding: 18px 18px 14px; border-radius: 18px; background: var(--layer-3); color: var(--text); box-shadow: inset 0 0 0 1px var(--line-2), 0 24px 60px rgba(0, 0, 0, 0.7); transition: top 300ms var(--ease), left 300ms var(--ease); }
.tour-card h3 { margin: 0; font-size: 15px; font-weight: 500; }
.tour-card p { margin: 6px 0 0; color: var(--text-2); font-size: 13.5px; line-height: 1.5; }
.tour-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 14px; }
.tour-foot > span { color: var(--text-3); font-size: 12px; }
.tour-foot .row { display: flex; gap: 8px; }
@media (max-width: 860px) {
  .ob-text { padding: 18px 16px 16px; }
  .ob-copy h1 { font-size: 19px; }
  .ob-copy p { font-size: 13.5px; }
  .ob-progress i { width: 20px; }
  .mb-bar .menu-name { display: none; }
  .mb-menu { right: 8px; }
  dialog.ob { width: calc(100vw - 20px); max-height: calc(100vh - 20px); border-radius: 26px; }
  .tour-card { width: calc(100vw - 32px); }
}
@media (prefers-reduced-motion: reduce) {
  dialog.ob[open], .ob-in > *, .ob-out > *, .ob-swap, .mb-menu, .btn.beckon::before, .btn.beckon::after { animation: none; }

  .orb .pulse { opacity: 0; }
  .scan-row, .scan-row .v, .scan-row .dot, .scan-more, .ob-progress i::after, .mb-gl i { transition: none; }
  .tour-spot, .tour-card { transition: none; }
  .tour-spot::before, .tour-spot::after { animation: none; }
}

/* overview plan */
.plan-row { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 14px; min-height: 64px; padding: 10px var(--inset); border-top: 1px solid var(--line); }
.plan-row b { display: block; font-size: 14px; font-weight: 500; }
.plan-row small { display: block; color: var(--text-3); font-size: 12.5px; }

/* numbers with a verdict */
.cell .unit { display: block; margin-top: 8px; color: var(--text-2); font-size: 12.5px; }

/* help for steps that need an AI assistant */
.guide { display: flex; flex-wrap: wrap; gap: 4px 16px; margin: 12px 0 0; padding: 0; list-style: none; color: var(--text-3); font-size: 12.5px; counter-reset: g; }
.guide li { counter-increment: g; }
.guide li::before { content: counter(g) ". "; }
.map-note { margin: -8px 0 14px; color: var(--text-3); font-size: 12.5px; display: flex; align-items: center; gap: 7px; }

/* sidebar extras */
.side-tools { margin-top: auto; display: grid; gap: 2px; padding-top: 14px; }
.side-tools .link { display: flex; align-items: center; gap: 11px; min-height: 36px; padding: 0 12px; border: 0; border-radius: 10px; background: none; color: var(--text-2); font-size: 13px; text-align: left; cursor: pointer; }
.side-tools .link:hover { color: var(--text); background: var(--layer-1); }
.side-tools .link svg { width: 16px; height: 16px; color: var(--text-3); }
.switch { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 36px; padding: 0 12px; border-radius: 10px; color: var(--text-2); font-size: 13px; cursor: pointer; }
.switch:hover { color: var(--text); background: var(--layer-1); }
.switch input { appearance: none; position: relative; flex: none; width: 30px; height: 18px; margin: 0; border-radius: 999px; background: var(--layer-3); box-shadow: inset 0 0 0 1px var(--line-2); cursor: pointer; transition: background-color 160ms var(--ease); }
.switch input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 12px; height: 12px; border-radius: 50%; background: var(--text-3); transition: transform 160ms var(--ease), background-color 160ms var(--ease); }
.switch input:checked { background: var(--text-2); }
.switch input:checked::after { transform: translateX(12px); background: var(--black); }
.side-note { padding: 8px 12px 0; color: var(--text-3); font-size: 12px; line-height: 1.5; }
.warn { color: var(--amber); }
.panel-note { margin: -6px 0 0; padding: 0 var(--inset) 14px; color: var(--text-3); font-size: 12.5px; }

@media (max-width: 860px) {
  .side-tools, .side-note { display: none; }
}

<script id="housekeep-live" type="application/json">/*__HOUSEKEEP_LIVE__*/null</script>
<script id="housekeep-data" type="application/json">/*__HOUSEKEEP_DATA__*/null</script>
<script>
(() => {
  "use strict";
  // Scrollbars show while something scrolls, and hide again 800ms after it stops.
  const hideAfter = new WeakMap();
  document.addEventListener("scroll", (e) => {
    const box = e.target === document ? document.documentElement : e.target;
    if (!(box instanceof Element)) return;
    box.classList.add("scrolling");
    clearTimeout(hideAfter.get(box));
    hideAfter.set(box, setTimeout(() => box.classList.remove("scrolling"), 800));
  }, { capture: true, passive: true });

  // LIVE is set when the page comes from the Housekeep server: updates stream in and buttons work.
  // Without it (the file in state/), the page is a read-only snapshot.
  const LIVE = JSON.parse(document.getElementById("housekeep-live").textContent);
  let data = JSON.parse(document.getElementById("housekeep-data").textContent) || { projects: [], error: { title: "No data yet", detail: "Run housekeep in a terminal to fill this page." } };
  const SVG = "http://www.w3.org/2000/svg";
  const KEYS = ["commit", "push", "sync", "cleanup"];
  const TERM_FOR = { commit: "commit", push: "push", sync: "main", cleanup: "cleanup" };
  const SAY = { "at-risk": "Could lose work", attention: "Needs attention", safe: "All clear" };
  const OPENER_LABEL = { files: /Mac/.test(navigator.userAgent) ? "Finder" : "Files", terminal: "Terminal", vscode: "VS Code", cursor: "Cursor" };
  // The browser runs on the machine being checked, so it knows what to call it.
  const HERE = /Mac/.test(navigator.userAgent) ? "this Mac" : "this computer";
  const DEPLOY = "If this project goes live whenever main changes (Vercel, Netlify and similar hosts do this), this can put it live.";
  // Where work lives online: a project's own server, or across all projects the one they share.
  const hostAll = () => {
    const hosts = [...new Set((data.projects || []).map((p) => p.host).filter(Boolean))];
    return hosts.length === 1 ? hosts[0] : hosts.length ? "the server" : "GitHub";
  };
  const H = (p) => (p && p.host) || hostAll();
  const pushRemote = (p) => (p.remotes && p.remotes.push) || "origin";
  const GLOSSARY = {
    commit: ["Commit", "A saved snapshot in git's history. Saving a file in your editor isn't a commit: you (or your AI assistant) commit once something works, and that's the version you can always get back. Changes you haven't committed yet are uncommitted."],
    push: ["Push", `Copying your commits to the remote (usually GitHub), so they survive if ${HERE} is lost, stolen or wiped. Commits that exist only here are unpushed.`],
    main: ["main", "The default branch: the main version of your project, usually the one that goes live. origin/main is the remote's copy, and it's the source of truth. Up to date means yours matches it."],
    branch: ["Branch", "A separate line of work that starts from main, so you can try things without touching main. When it's done, it's merged back into main."],
    merge: ["Merge", "Folding a branch's commits into main. A branch whose work is already in main is merged, and safe to delete. If your project deploys from main, merging and pushing main ships the change."],
    pr: ["Pull request", "A proposal, on GitHub, to merge a branch into main. Automatic checks and other people can look at it first, and GitHub can delete the branch once it's merged."],
    pull: ["Pull", "Bringing the remote's new commits into your branch. A fast-forward pull only adds them on top, so nothing you have is lost."],
    upstream: ["Upstream", "The remote branch a local branch follows; git push and git pull use it by default. Upstream gone means that remote branch was deleted."],
    worktree: ["Worktree", "An extra working folder for the same repo, checked out on a different branch. Tools like Codex and Claude Code make these, and they're easy to forget. A prunable worktree is one whose folder was deleted."],
    stash: ["Stash", "Changes set aside with git stash to clear your working tree, without committing them. They sit out of sight until someone applies or drops them."],
    cleanup: ["Cleanup", "Merged branches and worktrees left behind after the work is done, locally or on the remote. Unmerged branches are work in progress, not mess."],
    squash: ["Squash-merged", "A branch can be merged by folding all its commits into one new commit on main. The branch's own commits never land in main, but every change on it does, so it's merged."],
    detached: ["Detached HEAD", "A working tree that's on a specific commit instead of a branch. New commits made there belong to no branch, so switching away loses them unless they're saved to one. Push does that for you."],
    diverged: ["Diverged", "Your main and the remote's main each have commits the other doesn't, so neither can simply fast-forward. It needs a careful fix."],
  };
  const busy = new Set();
  const expanded = new Set();
  let route = null;
  let checking = false;

  const pref = (key, value) => {
    try {
      if (value === undefined) return localStorage.getItem(key);
      localStorage.setItem(key, value);
    } catch (err) {
      // Private windows can refuse storage; the page still works, it just won't remember.
      return null;
    }
    return value;
  };
  let advanced = pref("housekeep.advanced") === "1";

  /* ---------- helpers ---------- */

  const el = (tag, attrs = {}, ...kids) => {
    const node = tag.startsWith("svg:") ? document.createElementNS(SVG, tag.slice(4)) : document.createElement(tag);
    let style = "";
    for (const [k, v] of Object.entries(attrs)) {
      if (v === null || v === undefined || v === false) continue;
      if (k === "text") node.textContent = v;
      // Presentation attributes don't resolve custom properties; theme colours go through style.
      else if (typeof v === "string" && v.startsWith("var(")) style += `${k}:${v};`;
      else node.setAttribute(k, v);
    }
    if (style) node.setAttribute("style", `${node.getAttribute("style") || ""};${style}`.replace(/^;/, ""));
    for (const kid of kids.flat()) if (kid !== null && kid !== undefined && kid !== false) node.append(kid);
    return node;
  };
  const ICONS = {
    grid: ["M3 3h4v4H3z", "M9 3h4v4H9z", "M3 9h4v4H3z", "M9 9h4v4H9z"],
    copy: ["M6 6h6a1.5 1.5 0 0 1 1.5 1.5v6A1.5 1.5 0 0 1 12 15H6a1.5 1.5 0 0 1-1.5-1.5v-6A1.5 1.5 0 0 1 6 6z", "M11 3.5V3A1.5 1.5 0 0 0 9.5 1.5h-6A1.5 1.5 0 0 0 2 3v6a1.5 1.5 0 0 0 1.5 1.5H4"],
    check: ["M3 8.5l3.2 3L13 4.5"],
    folder: ["M2 4.5A1.5 1.5 0 0 1 3.5 3h3l1.5 2h4.5A1.5 1.5 0 0 1 14 6.5v5a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 2 11.5z"],
    upload: ["M8 10.5V2.5", "M4.5 6L8 2.5 11.5 6", "M2.5 10.5v2a1 1 0 0 0 1 1h9a1 1 0 0 0 1-1v-2"],
    download: ["M8 2.5v8", "M4.5 7L8 10.5 11.5 7", "M2.5 10.5v2a1 1 0 0 0 1 1h9a1 1 0 0 0 1-1v-2"],
    merge: ["M4.5 2.5v11", "M4.5 5.5c0 3.5 7 2.5 7 7", "M9.5 11l2 2 2-2"],
    pr: ["M4.5 2.5v11", "M11.5 13.5V7a2.5 2.5 0 0 0-2.5-2.5H6.5", "M8.5 2.5l-2 2 2 2"],
    trash: ["M2.5 4.5h11", "M6 4.5V3a.5.5 0 0 1 .5-.5h3a.5.5 0 0 1 .5.5v1.5", "M4 4.5l.7 9h6.6l.7-9"],
    terminal: ["M2 3.5h12v9H2z", "M4.5 6.5L6.5 8l-2 1.5", "M8 10h3.5"],
    code: ["M5.5 4.5L2 8l3.5 3.5", "M10.5 4.5L14 8l-3.5 3.5"],
    close: ["M4 4l8 8", "M12 4l-8 8"],
    eraser: ["M9.5 3l3.5 3.5L7 12.5H3.5L2.5 11.5z", "M6 12.5h7.5"],
    chevron: ["M6 4l4 4-4 4"],
    down: ["M4 6l4 4 4-4"],
    help: ["M8 14.5a6.5 6.5 0 1 0 0-13 6.5 6.5 0 0 0 0 13z", "M6.2 6.2a1.9 1.9 0 0 1 3.6.8c0 1.3-1.8 1.6-1.8 2.8", "M8 11.6v.1"],
  };
  const icon = (name, cls) => el("svg:svg", { class: cls || null, viewBox: "0 0 16 16", fill: "none", stroke: "currentColor", "stroke-width": 1.5, "stroke-linecap": "round", "stroke-linejoin": "round", "aria-hidden": "true" },
    ...ICONS[name].map((d) => el("svg:path", { d })));
  const spinner = () => el("svg:svg", { class: "spin", viewBox: "0 0 16 16", fill: "none", stroke: "currentColor", "stroke-width": 1.5, "stroke-linecap": "round", "aria-hidden": "true" }, el("svg:path", { d: "M8 2.5a5.5 5.5 0 1 1-5.5 5.5" }));
  const plural = (n, one, many) => `${n} ${n === 1 ? one : (many || one + "s")}`;
  const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  const shortPath = (full) => { const parts = full.replace(/^\/Users\/[^/]+/, "~").split("/"); return parts.length > 4 ? "…/" + parts.slice(-3).join("/") : parts.join("/"); };
  const since = (seconds) => {
    if (seconds < 60) return "just now";
    if (seconds < 3600) return `${Math.floor(seconds / 60)} min ago`;
    if (seconds < 86400) return `${Math.floor(seconds / 3600)} h ago`;
    const d = Math.floor(seconds / 86400);
    return d < 60 ? `${d} day${d === 1 ? "" : "s"} ago` : `${Math.floor(d / 30)} months ago`;
  };
  const ago = (iso) => iso ? since(Math.max(0, Math.round((Date.now() - new Date(iso).getTime()) / 1000))) : "never";
  const agoUnix = (unix) => unix ? since(Math.max(0, Math.round(Date.now() / 1000 - unix))) : "";
  const sig = (p, key) => (p.signals || []).find((s) => s.key === key) || { tier: "unknown", value: null, unit: "", cell: "", headline: "", hint: "", details: [] };
  const dot = (tier) => el("span", { class: "dot", "data-tier": tier });
  const status = (tier, text) => el("span", { class: "status", "data-tier": tier }, dot(tier), text);
  const branchName = (name) => {
    const slash = name.lastIndexOf("/");
    return el("span", { class: "n", title: name }, slash > 0 ? [el("i", { text: name.slice(0, slash + 1) }), name.slice(slash + 1)] : name);
  };

  /* ---------- "What's this?" ---------- */

  const glossary = document.getElementById("glossary");
  let lastQuestion = null;
  for (const [key, [title, body]] of Object.entries(GLOSSARY)) {
    const pop = el("div", { class: "gloss", id: `g-${key}`, popover: "auto", role: "tooltip" }, el("b", { text: title }), body);
    pop.addEventListener("toggle", (e) => {
      if (e.newState !== "open" || !lastQuestion) return;
      const r = lastQuestion.getBoundingClientRect();
      const w = pop.offsetWidth, h = pop.offsetHeight;
      const left = Math.max(12, Math.min(window.innerWidth - w - 12, r.left + r.width / 2 - w / 2));
      const below = r.bottom + 8 + h < window.innerHeight;
      pop.style.left = `${left}px`;
      pop.style.top = `${below ? r.bottom + 8 : r.top - h - 8}px`;
    });
    glossary.append(pop);
  }
  document.addEventListener("click", (e) => { const q = e.target.closest(".q"); if (q) lastQuestion = q; }, true);
  const q = (key, label) => el("button", { class: "q", type: "button", popovertarget: `g-${key}`, "aria-label": `What does ${label || GLOSSARY[key][0]} mean?` }, "?");
  const term = (text, key) => el("span", { class: "term" }, text, q(key, text));

  /* ---------- talking to the server ---------- */

  // Demo mode: made-up projects, and buttons that show what they'd do without doing it.
  const DEMO = Boolean(LIVE && LIVE.demo);
  // A demo page can be saved and served for months: keep it looking freshly checked.
  if (DEMO && data.generatedAt) {
    const shift = Date.now() - new Date(data.generatedAt).getTime();
    const later = (iso) => iso ? new Date(new Date(iso).getTime() + shift).toISOString() : iso;
    data.generatedAt = later(data.generatedAt);
    for (const p of data.projects || []) {
      if (p.fetch) p.fetch.at = later(p.fetch.at);
      for (const b of [...(p.branches || []), ...(p.remoteBranches || [])]) if (b.lastCommit) b.lastCommit += Math.round(shift / 1000);
    }
  }
  const DEMO_DONE = "Demo: nothing was changed. On your own repos, this runs for real.";

  async function api(path, body) {
    if (DEMO) {
      await new Promise((resolve) => setTimeout(resolve, 700));
      return path.startsWith("/api/check") ? data : { ok: true, message: DEMO_DONE, output: "" };
    }
    const response = await fetch(path, {
      method: body ? "POST" : "GET",
      headers: { "Content-Type": "application/json", "X-Housekeep-Token": LIVE.token },
      body: body ? JSON.stringify(body) : undefined,
    });
    const payload = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(payload.error || `Housekeep answered ${response.status}.`);
    return payload;
  }

  const liveButton = document.getElementById("live");
  function setLive(state) {
    liveButton.dataset.state = state;
    liveButton.querySelector(".word").textContent = { live: "Live", reconnecting: "Reconnecting", restart: "Reload", snapshot: "Snapshot", demo: "Demo" }[state];
    liveButton.title = { live: "Updates arrive as your projects change", reconnecting: "Lost the connection to Housekeep. Trying again.", restart: "Housekeep restarted. Reload to reconnect.", snapshot: "A saved copy. Run housekeep open for live updates and buttons.", demo: "Made-up projects, so you can try every button. Nothing on your computer is read or changed." }[state];
  }
  liveButton.addEventListener("click", () => { if (liveButton.dataset.state === "restart") location.reload(); });

  function connect() {
    let failures = 0;
    const events = new EventSource(`/api/events?token=${encodeURIComponent(LIVE.token)}`);
    events.addEventListener("state", (e) => {
      failures = 0;
      data = JSON.parse(e.data);
      setLive("live");
      render();
    });
    events.onopen = () => { failures = 0; setLive("live"); };
    events.onerror = () => {
      failures += 1;
      // A token mismatch never recovers on its own: the server restarted with a new one.
      setLive(failures > 3 ? "restart" : "reconnecting");
    };
  }

  function toast(tier, message, output) {
    const close = el("button", { class: "btn ghost icon", type: "button", "aria-label": "Dismiss" }, icon("close"));
    const node = el("div", { class: "toast", role: tier === "at-risk" ? "alert" : "status" },
      dot(tier),
      el("div", {}, el("b", { text: message }), output ? el("pre", { text: output.split("\n").filter(Boolean).slice(-3).join("\n") }) : null),
      close);
    const dismiss = () => { node.classList.add("leaving"); setTimeout(() => node.remove(), 160); };
    close.addEventListener("click", dismiss);
    document.getElementById("toasts").append(node);
    setTimeout(dismiss, tier === "at-risk" ? 12000 : 6000);
  }

  function ask({ title, body, warning, items = [], command, confirmText, danger }) {
    return new Promise((resolve) => {
      const cancel = el("button", { class: "btn ghost", type: "button" }, el("span", { text: "Cancel" }));
      const ok = el("button", { class: "btn primary", type: "button" }, el("span", { text: confirmText }));
      const dialog = el("dialog", { class: "confirm", "aria-label": title },
        el("div", { class: "confirm-body" },
          el("h3", { text: title }),
          body ? el("p", { text: body }) : null,
          warning ? el("p", { class: "warn", text: warning }) : null,
          items.length ? el("ul", {}, items.map(([a, b]) => el("li", {}, el("span", { text: a }), el("span", { text: b || "" })))) : null,
          command ? el("pre", { text: command }) : null),
        el("div", { class: "confirm-actions" }, cancel, ok));
      cancel.addEventListener("click", () => dialog.close("cancel"));
      ok.addEventListener("click", () => dialog.close("ok"));
      dialog.addEventListener("close", () => { resolve(dialog.returnValue === "ok"); dialog.remove(); });
      document.body.append(dialog);
      dialog.showModal();
      (danger || warning ? cancel : ok).focus();
    });
  }

  async function run(p, action, payload, key) {
    busy.add(key);
    render();
    try {
      const result = await api("/api/action", { project: p.path, action, ...payload });
      toast("safe", result.message, action === "open" ? "" : result.output);
    } catch (err) {
      toast("at-risk", err.message);
    } finally {
      busy.delete(key);
      render();
    }
  }

  // A button that runs one allow-listed action, optionally behind a confirm dialog.
  function actionButton(p, action, { payload = {}, text, iconName, tone = "", title, confirm } = {}) {
    if (!LIVE) return null;
    const key = `${p.path}|${action}|${JSON.stringify(payload)}`;
    const working = busy.has(key);
    const button = el("button", { class: `btn${tone ? " " + tone : ""}${text ? "" : " icon"}${working ? " busy" : ""}`, type: "button", title: title || null, "aria-label": title || text },
      iconName ? icon(iconName, "idle") : null, spinner(), text ? el("span", { text: working ? "Working" : text }) : null);
    button.addEventListener("click", async () => {
      if (confirm && !(await ask(confirm))) return;
      run(p, action, payload, key);
    });
    return button;
  }

  function copyButton(text, { label = "Copy request", tone = "" } = {}) {
    const button = el("button", { class: `btn${tone ? " " + tone : ""}`, type: "button" }, icon("copy", "idle"), icon("check", "done"), el("span", { text: label }));
    button.addEventListener("click", () => {
      const done = (ok) => {
        button.classList.toggle("copied", ok);
        button.querySelector("span").textContent = ok ? "Copied" : label;
        toast(ok ? "safe" : "at-risk", ok ? "Copied. Paste it into your AI coding assistant, opened in this project's folder." : "Couldn't reach the clipboard.");
        setTimeout(() => { button.classList.remove("copied"); button.querySelector("span").textContent = label; }, 1800);
      };
      if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(() => done(true), () => done(false));
      else {
        const area = el("textarea", { style: "position:absolute;left:-9999px", "aria-hidden": "true" });
        area.value = text;
        document.body.append(area);
        area.select();
        const ok = document.execCommand("copy");
        area.remove();
        done(ok);
      }
    });
    return button;
  }

  function openMenu(p) {
    if (!LIVE || !(LIVE.openers || []).length) return null;
    const menu = el("details", { class: "menu" },
      el("summary", { class: "btn", "aria-label": "Open this project in another app" }, el("span", { text: "Open in" }), icon("down", "trail")),
      el("div", { class: "menu-list" }, LIVE.openers.map((k) => actionButton(p, "open", { payload: { app: k, path: p.path }, text: OPENER_LABEL[k], iconName: k === "terminal" ? "terminal" : k === "files" ? "folder" : "code" }))));
    menu.addEventListener("click", (e) => { if (e.target.closest(".menu-list")) menu.open = false; });
    return menu;
  }
  document.addEventListener("click", (e) => {
    document.querySelectorAll("details.menu[open]").forEach((m) => { if (!m.contains(e.target)) m.open = false; });
  });

  /* ---------- what each button means ---------- */

  const deletable = (p) => p.branches.filter((b) => b.state === "merged" && !b.worktree && !b.current);
  const remoteName = (p) => (p.remotes && p.remotes.push) || "origin";
  const mainRef = (p) => (p.main && p.main.remoteRef) || `${remoteName(p)}/${(p.main && p.main.name) || "main"}`;
  const how = (b) => b.merged === "squashed" ? "squash-merged" : "merged";
  const pushAllConfirm = (p) => {
    const m = p.main || {};
    const remote = remoteName(p);
    const items = p.branches.filter((b) => b.localOnly).map((b) => [b.name, plural(b.localOnly, "unpushed commit")]);
    const lines = p.branches.filter((b) => b.localOnly).map((b) => `git push -u ${remote} ${b.name}`);
    if (m.localOnly) {
      items.unshift([`${m.name}, pushed as a backup branch`, plural(m.localOnly, "unpushed commit")]);
      lines.unshift(`git push ${remote} ${m.name}:housekeep/backup-${m.name}-<date>`);
    }
    return {
      title: `Push to ${remote}`,
      body: `Copies these commits to ${H(p)} so they're safe if ${HERE} is lost. ${m.localOnly ? `Commits on ${m.name} go to a separate backup branch, so ${mainRef(p)}, and your live site, stay exactly as they are.` : "Nothing is merged, rewritten or deleted."}`,
      items, command: lines.join("\n"), confirmText: "Push",
    };
  };
  const pushBranchConfirm = (p, b) => ({
    title: `Push ${b.name}`,
    body: `Copies this branch to ${H(p)} so its commits are safe if ${HERE} is lost. Nothing is merged or deleted, and nothing goes live.`,
    items: [[b.name, plural(b.localOnly, "unpushed commit")]], command: `git push -u ${remoteName(p)} ${b.name}`, confirmText: "Push",
  });
  const pushMainConfirm = (p) => ({
    title: `Push ${p.main.name} to ${remoteName(p)}`,
    body: `Updates ${mainRef(p)} with ${plural(p.main.ahead, "commit")} from ${HERE}. This skips pull request reviews and checks.`,
    warning: DEPLOY, command: `git push ${remoteName(p)} ${p.main.name}`, confirmText: `Push ${p.main.name}`, danger: true,
  });
  const deleteConfirm = (p, names) => ({
    title: names.length === 1 ? `Delete ${names[0]}` : `Delete ${plural(names.length, "merged branch", "merged branches")}`,
    body: `Everything on ${names.length === 1 ? "it" : "these"} is already in ${mainRef(p)}, so no work is lost. Branches on ${remoteName(p)} aren't touched. Each one is checked again right before it's deleted.`,
    items: names.map((n) => [n, how(p.branches.find((b) => b.name === n) || {})]), command: names.map((n) => `git branch -D ${n}`).join("\n"),
    confirmText: "Delete", danger: true,
  });
  const remoteClearable = (p) => (p.remoteBranches || []).filter((b) => b.deletable);
  const unchecked = (p) => {
    const g = p.github || {};
    if (g.checked) return null;
    return p.host === "GitHub"
      ? `GitHub couldn't be asked about protected branches or open pull requests (${g.reason || "unknown reason"}), so they're judged by name only.`
      : `${H(p)} can't be asked about protected branches or open pull requests, so they're judged by name only.`;
  };
  const remoteConfirm = (p, names) => ({
    title: names.length === 1 ? `Delete ${names[0]} on ${remoteName(p)}` : `Delete ${plural(names.length, "merged branch", "merged branches")} on ${remoteName(p)}`,
    body: `Every change on ${names.length === 1 ? "it" : "these"} is already in ${mainRef(p)}, so no work is lost. ${mainRef(p)} and your live site aren't touched. Each one is checked against ${H(p)} again right before it's deleted, and left alone if anyone has pushed to it since.`,
    warning: unchecked(p) ? `${unchecked(p)} Make sure nobody is still using these.` : null,
    items: names.map((n) => [n, how(p.remoteBranches.find((g) => g.name === n) || {})]),
    command: names.map((n) => `git push ${remoteName(p)} --delete ${n}`).join("\n"),
    confirmText: `Delete on ${remoteName(p)}`, danger: true,
  });
  const canPR = (p) => Boolean(LIVE && p.github && p.github.checked && p.main && p.main.remoteMain);
  const prConfirm = (p, b) => ({
    title: `Open a pull request for ${b.name}`,
    body: `Proposes merging ${plural(b.aheadOfMain, "commit")} into ${mainRef(p)} on GitHub, so checks and reviews can run first. ${b.localOnly || !b.onRemote ? "The branch is pushed first. " : ""}Nothing is merged yet, and nothing goes live.`,
    command: [b.localOnly || !b.onRemote ? `git push -u ${remoteName(p)} ${b.name}` : "", `gh pr create --base ${p.main.name} --head ${b.name} --fill`].filter(Boolean).join("\n"),
    confirmText: "Open pull request",
  });
  const mergeConfirm = (p, b) => ({
    title: `Merge ${b.name} into ${p.main.name}`,
    body: `Adds ${plural(b.aheadOfMain, "commit")} to your local ${p.main.name}. Nothing is pushed yet. If it conflicts, the merge is aborted and nothing changes. This skips pull request reviews and checks, and leaves the branch on ${remoteName(p)} to delete afterwards.`,
    warning: `Once you push ${p.main.name} afterwards: ${DEPLOY}`, command: `git merge --no-ff ${b.name}`, confirmText: "Merge", danger: true,
  });
  const unsetConfirm = (p, names) => ({
    title: names.length === 1 ? `Unset upstream on ${names[0]}` : `Unset upstream on ${plural(names.length, "branch", "branches")}`,
    body: `${names.length === 1 ? "This branch tracks" : "These branches track"} ${mainRef(p)}. With some git settings (push.default=upstream), a plain git push would then update ${mainRef(p)} directly. This only changes that setting: no commits or files change, and the next push gives ${names.length === 1 ? "it" : "each one"} an upstream of its own.`,
    command: names.map((n) => `git branch --unset-upstream ${n}`).join("\n"), confirmText: "Unset upstream",
  });
  const fetchAllConfirm = (p) => ({
    title: p.limits && p.limits.shallow ? "Fetch the full history" : "Fetch all branches",
    body: `This is a ${p.limits && p.limits.shallow ? "shallow" : "single-branch"} clone, so some checks can't see everything. This fetches the rest from ${H(p)}. It can take a while for big repos. Your files and branches don't change.`,
    command: [p.limits && p.limits.singleBranch ? `git config --replace-all remote.${remoteName(p)}.fetch "+refs/heads/*:refs/remotes/${remoteName(p)}/*"` : "",
      p.limits && p.limits.shallow ? `git fetch --unshallow ${(p.remotes || {}).truth || "origin"}` : "", "git fetch --prune"].filter(Boolean).join("\n"),
    confirmText: "Fetch",
  });
  const autoDeleteConfirm = (p) => ({
    title: "Let GitHub delete merged branches",
    body: "Turns on GitHub's \"Automatically delete head branches\" setting for this repo, so each pull request's branch is deleted once it's merged. Protected branches, and branches merged any other way, aren't affected.",
    command: `gh api -X PATCH repos/${(p.github || {}).slug} -F delete_branch_on_merge=true`, confirmText: "Turn on",
  });
  const divergedAsk = (p) => `In ${p.path}, local ${p.main.name} and ${mainRef(p)} have diverged: ${p.main.ahead} commits only here and ${p.main.behind} only there. Explain what's on each side in plain English and propose the safest way to reconcile them. Don't push, force-push or delete anything without asking.`;

  // The button that carries out a project's Start here step, when it's safe enough for one click.
  function primaryAction(p, tone = "primary") {
    if (!LIVE || !p.next) return null;
    const m = p.main || {};
    switch (p.next.kind) {
      case "push-all": return actionButton(p, "push-all", { text: `Push to ${remoteName(p)}`, iconName: "upload", tone, confirm: pushAllConfirm(p) });
      case "pull": return actionButton(p, "pull", { text: `Pull ${m.name}`, iconName: "download", tone, title: "Fast-forward only: nothing here is lost" });
      case "delete-merged": {
        const names = deletable(p).map((b) => b.name);
        return names.length ? actionButton(p, "delete-merged", { payload: { branches: names }, text: `Delete ${plural(names.length, "merged branch", "merged branches")}`, iconName: "trash", tone, confirm: deleteConfirm(p, names) }) : null;
      }
      case "delete-remote": {
        const names = remoteClearable(p).map((b) => b.name);
        return names.length ? actionButton(p, "delete-remote", { payload: { branches: names }, text: `Delete ${plural(names.length, "merged branch", "merged branches")} on ${remoteName(p)}`, iconName: "trash", tone, confirm: remoteConfirm(p, names) }) : null;
      }
      case "unset-upstream": {
        const names = p.branches.filter((b) => b.pushesToMain).map((b) => b.name);
        return names.length ? actionButton(p, "unset-upstream", { payload: { branches: names }, text: "Unset upstream", tone, confirm: unsetConfirm(p, names) }) : null;
      }
      case "fetch-all": return actionButton(p, "fetch-all", { text: p.limits && p.limits.shallow ? "Fetch full history" : "Fetch all branches", iconName: "download", tone, confirm: fetchAllConfirm(p) });
      case "prune-worktrees": return actionButton(p, "prune-worktrees", { text: "Prune worktrees", iconName: "eraser", tone });
      case "restore-pruned": {
        const names = (p.pruned || []).map((b) => b.name);
        return names.length ? actionButton(p, "restore-pruned", { payload: { branches: names }, text: `Restore ${plural(names.length, "branch", "branches")}`, iconName: "download", tone,
          confirm: { title: `Restore ${plural(names.length, "deleted branch", "deleted branches")}`,
            body: `${names.length === 1 ? "This branch was" : "These branches were"} deleted on ${remoteName(p)} while holding work that isn't in ${mainRef(p)}. Housekeep kept the commits; this turns them back into local branches so you can look at them, push them or delete them.`,
            items: p.pruned.map((b) => [b.name, plural(b.commits, "commit")]), command: p.pruned.map((b) => `git branch ${b.name.split("/").slice(1).join("/")} ${b.ref}`).join("\n"), confirmText: "Restore" } }) : null;
      }
      default: return null;
    }
  }

  /* ---------- chrome ---------- */

  const checkNow = document.getElementById("check-now");
  if (LIVE) {
    checkNow.removeAttribute("href");
    checkNow.setAttribute("role", "button");
    checkNow.tabIndex = 0;
    checkNow.title = "Re-check every project and its server now";
    checkNow.addEventListener("click", async () => {
      if (checking) return;
      checking = true;
      checkNow.classList.add("busy");
      checkNow.querySelector(".label").textContent = "Checking";
      try {
        // Waits for the full re-check, servers included; the new state also arrives on the stream.
        await api("/api/check?wait=1", {});
      } catch (err) {
        toast("at-risk", err.message);
      }
      checking = false;
      checkNow.classList.remove("busy");
      checkNow.querySelector(".label").textContent = "Check now";
    });
  } else {
    // A saved snapshot can't re-check; `housekeep open` starts the live map.
    checkNow.hidden = true;
  }

  function renderChrome(projects, need) {
    const worst = data.error ? "unknown" : (projects[0] ? projects[0].tier : "safe");
    document.getElementById("brand-dot").dataset.tier = worst;
    document.title = data.error ? "Housekeep · couldn't check" : need.length ? `Housekeep · ${need.length} need${need.length === 1 ? "s" : ""} you` : "Housekeep · all clear";
    const color = css({ "at-risk": "--red", attention: "--amber", safe: "--green" }[worst] || "--text-3");
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><rect width="32" height="32" rx="8" fill="#000"/><g transform="translate(4 4) scale(0.75)"><path d="M3.5 16H12" stroke="#d9d9d9" stroke-width="3.5" stroke-linecap="round"/><rect x="11" y="10.5" width="18" height="11" rx="5.5" fill="#000" stroke="#d9d9d9" stroke-width="3"/><circle cx="23.5" cy="16" r="2.4" fill="${color}"/></g></svg>`;
    document.getElementById("favicon").href = "data:image/svg+xml," + encodeURIComponent(svg);
    renderChecked();
    document.getElementById("nav-top").replaceChildren(
      el("a", { href: "#all", "aria-current": route === "all" ? "page" : "false" }, icon("grid"), el("span", { class: "name", text: "Overview" }), need.length ? el("span", { class: "n", title: `${need.length} need you`, text: need.length }) : null));
    document.getElementById("nav-projects").replaceChildren(...projects.map((p) =>
      el("a", { href: `#${p.slug}`, title: `${p.name}: ${SAY[p.tier]}`, "aria-label": `${p.name}, ${SAY[p.tier]}`, "aria-current": route === p.slug ? "page" : "false" },
        el("span", { style: "display:grid;place-items:center;width:16px" }, dot(p.tier)), el("span", { class: "name", text: p.name }))));

    const help = el("button", { class: "link", type: "button" }, icon("help"), "How this works");
    help.addEventListener("click", () => startOnboarding());
    const toggle = el("input", { type: "checkbox", role: "switch", "aria-describedby": "advanced-note" });
    toggle.checked = advanced;
    toggle.addEventListener("change", () => { advanced = toggle.checked; pref("housekeep.advanced", advanced ? "1" : "0"); render(); });
    document.getElementById("side-tools").replaceChildren(help, LIVE ? el("label", { class: "switch" }, "Advanced actions", toggle) : null);
    document.getElementById("side-foot").replaceChildren(el("span", { id: "advanced-note",
      text: advanced ? "Merge and push to main are on. Pushing main can put a site live." : `Watching projects you've worked on in the last ${data.activeDays || 45} days.` }));
  }

  function renderChecked() {
    const projects = data.projects || [];
    const fetched = projects.map((p) => p.fetch && p.fetch.at).filter(Boolean).sort();
    const node = document.getElementById("checked");
    node.textContent = `Updated ${ago(data.generatedAt)}`;
    node.title = fetched.length ? `Last checked with ${hostAll()} ${ago(fetched[0])}` : "";
  }
  setInterval(renderChecked, 20000);

  /* ---------- overview ---------- */

  function strip(cells) {
    return el("section", { class: "panel strip" }, cells.map(({ tier, label, termKey, value, unit, hint }) =>
      el("div", { class: "cell", "data-tier": tier },
        el("div", { class: "label" }, dot(tier), termKey ? term(label, termKey) : label),
        el("span", { class: "value", text: value }),
        unit ? el("span", { class: "unit", text: unit }) : null,
        el("p", { class: "caption", text: hint }))));
  }

  function planPanel(projects) {
    const todo = projects.filter((p) => p.next && p.next.tier !== "safe");
    if (!todo.length) return null;
    const rows = todo.slice(0, 3).map((p) => {
      const open = el("a", { class: "btn", href: `#${p.slug}` }, el("span", { text: "Open" }));
      return el("div", { class: "plan-row" },
        dot(p.next.tier),
        el("div", { style: "min-width:0" }, el("b", { text: p.next.title }), el("small", { text: `${p.name} · ${p.next.why}` })),
        el("div", { class: "row-actions" }, primaryAction(p, "") || open));
    });
    return el("section", { class: "panel", "data-tour": "next-steps" },
      el("div", { class: "panel-head" }, el("h2", { text: "Your next steps" }), el("div", { class: "end", text: todo.length > 3 ? `Most urgent first · ${todo.length - 3} more below` : "Most urgent first" })),
      rows);
  }

  function overview(projects, need) {
    const n = projects.length;
    const sum = (key) => projects.reduce((t, p) => t + (sig(p, key).value || 0), 0);
    const affected = (key) => projects.filter((p) => sig(p, key).tier !== "safe").length;
    const inSync = projects.filter((p) => sig(p, "sync").tier === "safe").length;
    const loose = projects.reduce((t, p) => t + (sig(p, "commit").unit.startsWith("uncommitted") ? (sig(p, "commit").value || 0) : 0), 0);
    const atRisk = projects.filter((p) => p.tier === "at-risk").length;
    const unpushed = sum("push");
    const where = (k) => `${affected(k)} of ${n} projects`;

    const rows = projects.map((p) => {
      const tr = el("tr", { class: "link", tabindex: "0", "aria-label": `Open ${p.name}` },

  ];

  function startTour() {
    if (location.hash.slice(1) && location.hash.slice(1) !== "all") location.hash = "all";
    const steps = TOUR.filter((s) => document.querySelector(s.sel));
    if (!steps.length) return;
    let at = 0;
    const shield = el("div", { class: "tour-shield" });
    const spot = el("div", { class: "tour-spot", "aria-hidden": "true" });
    const title = el("h3", { id: "tour-title" });
    const body = el("p");
    const count = el("span");
    const back = el("button", { class: "btn ghost", type: "button" }, el("span", { text: "Back" }));
    const next = el("button", { class: "btn primary", type: "button" }, el("span"));
    const card = el("div", { class: "tour-card", role: "dialog", "aria-modal": "true", "aria-labelledby": "tour-title" },
      title, body, el("div", { class: "tour-foot" }, count, el("div", { class: "row" }, back, next)));

    const place = () => {
      const target = document.querySelector(steps[at].sel);
      if (!target) return;
      const r = target.getBoundingClientRect();
      const pad = 8;
      Object.assign(spot.style, { left: `${r.left - pad}px`, top: `${r.top - pad}px`, width: `${r.width + pad * 2}px`, height: `${r.height + pad * 2}px` });
      const cw = card.offsetWidth, ch = card.offsetHeight;
      const room = { right: window.innerWidth - r.right, below: window.innerHeight - r.bottom };
      let left, top;
      if (room.right > cw + 32) { left = r.right + 20; top = r.top; }
      else if (room.below > ch + 32) { left = r.left; top = r.bottom + 20; }
      else { left = r.left; top = r.top - ch - 20; }
      card.style.left = `${Math.max(16, Math.min(window.innerWidth - cw - 16, left))}px`;
      card.style.top = `${Math.max(16, Math.min(window.innerHeight - ch - 16, top))}px`;
    };
    const show = (i) => {
      at = Math.max(0, Math.min(steps.length - 1, i));
      title.textContent = steps[at].title;
      body.textContent = steps[at].body;
      count.textContent = `${at + 1} of ${steps.length}`;
      back.hidden = at === 0;
      next.querySelector("span").textContent = at === steps.length - 1 ? "Done" : "Next";
      const target = document.querySelector(steps[at].sel);
      if (target) target.scrollIntoView({ block: "center", behavior: "instant" });
      requestAnimationFrame(place);
      next.focus();
    };
    const end = () => {
      shield.remove(); spot.remove(); card.remove();
      window.removeEventListener("resize", place);
      shell.removeEventListener("scroll", place);
      document.removeEventListener("keydown", keys, true);
    };
    const keys = (e) => {
      if (e.key === "Escape") { e.preventDefault(); end(); }
      if (e.key === "ArrowRight") { e.preventDefault(); at === steps.length - 1 ? end() : show(at + 1); }
      if (e.key === "ArrowLeft") { e.preventDefault(); show(at - 1); }
    };
    next.addEventListener("click", () => (at === steps.length - 1 ? end() : show(at + 1)));
    back.addEventListener("click", () => show(at - 1));
    shield.addEventListener("click", () => next.focus());
    window.addEventListener("resize", place);
    shell.addEventListener("scroll", place, { passive: true });
    document.addEventListener("keydown", keys, true);
    document.body.append(shield, spot, card);
    show(0);
  }

  /* ---------- routing and rendering ---------- */

  const view = document.getElementById("view");
  const crumbs = document.getElementById("crumbs");
  const shell = document.querySelector(".main");
  // On wide screens the shell scrolls; on phones the page does.
  const scroller = () => getComputedStyle(shell).overflowY === "auto" ? shell : document.scrollingElement;
  const bar = document.querySelector(".bar");
  const markScrolled = () => bar.classList.toggle("scrolled", scroller().scrollTop > 4);
  shell.addEventListener("scroll", markScrolled, { passive: true });
  window.addEventListener("scroll", markScrolled, { passive: true });

  function paintMap() {
    if (mapBox && mapProject && mapBox.isConnected) mapBox.replaceChildren(drawMap(mapProject, Math.floor(mapBox.clientWidth)));
  }
  let frame = 0;
  new ResizeObserver(() => { cancelAnimationFrame(frame); frame = requestAnimationFrame(paintMap); }).observe(view);

  // Re-renders keep your place: live updates never jump the page or replay the entrance.
  function render() {
    const projects = data.projects || [];
    const need = projects.filter((p) => p.tier !== "safe");
    const p = projects.find((x) => x.slug === location.hash.slice(1));
    const target = p ? p.slug : "all";
    const moved = target !== route;
    route = target;
    renderChrome(projects, need);
    const y = scroller().scrollTop;
    mapBox = null;
    if (data.error) {
      crumbs.replaceChildren(el("span", { class: "here", text: "Housekeep" }));
      view.replaceChildren(el("div", { class: "empty" }, el("div", {}, el("h1", { text: "Couldn't check your projects" }), el("p", { text: `${data.error.title}. ${data.error.detail}` }))));
    } else if (!projects.length) {
      crumbs.replaceChildren(el("span", { class: "here", text: "Overview" }));
      view.replaceChildren(el("div", { class: "empty" }, el("div", {}, el("h1", { text: "Nothing active to watch" }), el("p", { text: `No git projects have changed in the last ${data.activeDays} days. Add folders to "watch" in ${data.configPath} to keep an eye on them anyway.` }))));
    } else if (p) {
      crumbs.replaceChildren(el("a", { href: "#all", text: "Overview" }), el("span", { text: "/" }), el("span", { class: "here", text: p.name }));
      view.replaceChildren(...project(p).filter(Boolean));
      paintMap();
    } else {
      crumbs.replaceChildren(el("span", { class: "here", text: "Overview" }));
      view.replaceChildren(...overview(projects, need).filter(Boolean));
    }
    if (moved) {
      view.classList.remove("enter");
      void view.offsetWidth;
      view.classList.add("enter");
      scroller().scrollTop = 0;
    } else {
      scroller().scrollTop = y;
    }
    markScrolled();
  }
  window.addEventListener("hashchange", render);
  render();
  // First visit: welcome them properly before anything else.
  // Embedded in another page (the website), the map speaks for itself; the tour is one click away in the sidebar.
  const embedded = new URLSearchParams(location.search).has("embed");
  if (pref(ONBOARDED) !== "done" && !data.error && !embedded) startOnboarding();
  if (document.fonts) document.fonts.ready.then(paintMap);

  document.addEventListener("keydown", (e) => {
    if (e.metaKey || e.ctrlKey || e.altKey || document.querySelector("dialog[open]") || /input|textarea|select/i.test(e.target.tagName)) return;
    const projects = data.projects || [];
    if (e.key === "0") location.hash = "all";
    const i = Number(e.key) - 1;
    if (i >= 0 && i < Math.min(9, projects.length)) location.hash = projects[i].slug;
  });

  if (DEMO) {
    setLive("demo");
  } else if (LIVE) {
    connect();
  } else {
    setLive("snapshot");
    // A snapshot can't be pushed to, so it refreshes itself instead.
    const loadedAt = Date.now();
    const reloadIfOld = () => { if (document.visibilityState === "visible" && Date.now() - loadedAt > 60000) location.reload(); };
    document.addEventListener("visibilitychange", reloadIfOld);
    setInterval(reloadIfOld, 120000);
  }
})();
</script>
</body>
</html>

name: Publish

# Publishes to npm when a release tag is pushed, through npm's trusted publishing: no token is stored
# anywhere, and npm attaches provenance, a signed record that this exact commit and workflow built it.
on:
  push:
    tags:
      - "v*"

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      # The tag must match the version being published, so a stray tag can't publish the wrong thing.
      - run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: npm ci
      # prepublishOnly builds and runs the tests first.
      - run: npm publish
